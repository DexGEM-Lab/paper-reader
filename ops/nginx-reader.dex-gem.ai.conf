# DexGEM Paper Reader: internal TLS vhost reached from the public stream-SNI listener.
server {
    listen 127.0.0.1:8443 ssl http2;
    server_name reader.dex-gem.ai;

    ssl_certificate /etc/xray/cert/dex-gem.ai.pem;
    ssl_certificate_key /etc/xray/cert/dex-gem.ai.key;

    client_max_body_size 100m;

    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

# Do not rely on the generic/default HTTP behavior for this hostname.
server {
    listen 80;
    server_name reader.dex-gem.ai;

    return 308 https://$host$request_uri;
}
